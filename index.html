=0?'SR':'Q'+(4-i)})<\/span><span id=\"v${i}_1\"><\/span><\/div>\n        <div class=\"in\" id=\"i${i}_2\"><span>2 Left (${i==3?'SL':'Q'+(2-i)})<\/span><span id=\"v${i}_2\"><\/span><\/div>\n        <div class=\"in\" id=\"i${i}_3\"><span>3 Load (D${3-i})<\/span><span id=\"v${i}_3\"><\/span><\/div>\n      <\/div>\n      <div class=\"arrow\">\u25bc D = <span id=\"d${i}\">0<\/span><\/div>\n      <div class=\"ff\" id=\"ff${i}\"><div class=\"small\">D flip-flop<\/div><div class=\"q\" id=\"q${i}\">0<\/div><\/div>\n    <\/div>`);\n  }\n  draw();\n}\nfunction inputs(i){ // values at the 4 mux inputs for stage i\n  return [\n    Q[i],\n    i==0?S.sr:Q[i-1],\n    i==3?S.sl:Q[i+1],\n    par[i]\n  ];\n}\nfunction draw(){\n  const md=mode();\n  for(let i=0;i<4;i++){\n    const v=inputs(i);\n    for(let k=0;k<4;k++){\n      document.getElementById(`v${i}_${k}`).textContent=v[k];\n      document.getElementById(`i${i}_${k}`).classList.toggle('act',k===md);\n    }\n    document.getElementById('d'+i).textContent=v[md];\n    const q=document.getElementById('q'+i);\n    q.textContent=Q[i];q.className='q '+(Q[i]?'one':'zero');\n  }\n  for(let k=0;k<4;k++)document.getElementById('m'+k).classList.toggle('sel',k===md);\n}\nfunction tg(k){S[k]^=1;sync()}\nfunction sync(){\n  ['s1','s0','sr','sl'].forEach(k=>{\n    const b=document.getElementById(k);\n    b.textContent=S[k];b.classList.toggle('on',S[k]===1);\n  });\n  const md=mode();\n  info(`S1S0 = ${S.s1}${S.s0}: ${names[md]}. The multiplexer in every stage routes input ${md} to its D input; the flip-flops copy it on the next rising clock edge.`);\n  draw();\n}\nfunction mkPar(){\n  const c=document.getElementById('pbtns');c.innerHTML='';\n  for(let i=0;i<4;i++){\n    const b=document.createElement('button');b.className='tog';b.textContent=0;\n    b.onclick=()=>{par[i]^=1;b.textContent=par[i];b.classList.toggle('on',par[i]===1);draw()};\n    c.appendChild(b);\n  }\n}\nfunction clock(){\n  const md=mode();\n  const next=Q.map((_,i)=>inputs(i)[md]);\n  const changed=next.map((v,i)=>v!==Q[i]);\n  Q=next;count++;\n  pulse();\n  draw();\n  for(let i=0;i<4;i++){\n    const f=document.getElementById('ff'+i);\n    f.classList.add('hi');setTimeout(()=>f.classList.remove('hi'),600);\n  }\n  const tb=document.querySelector('#tt tbody');\n  tb.querySelectorAll('tr').forEach(r=>r.classList.remove('cur'));\n  const tr=document.createElement('tr');tr.className='cur';\n  tr.innerHTML=`<td>${count}<\/td><td>${S.s1}${S.s0}<\/td><td>${names[md]}<\/td><td>${Q[0]}<\/td><td>${Q[1]}<\/td><td>${Q[2]}<\/td><td>${Q[3]}<\/td>`;\n  tb.appendChild(tr);\n  if(tb.rows.length>10)tb.deleteRow(0);\n  info(`Clock ${count} \u2014 ${names[md]}: Q3Q2Q1Q0 = ${Q.join('')}`+(md===0?' (unchanged)':''));\n}\nfunction clr(){\n  Q=[0,0,0,0];count=0;\n  document.querySelector('#tt tbody').innerHTML='';\n  draw();info('Asynchronous CLEAR: all flip-flops reset to 0 without needing a clock pulse.');\n}\nfunction pulse(){clkHigh=true;drawClk();setTimeout(()=>{clkHigh=false;drawClk()},350)}\nfunction drawClk(){\n  const c=document.getElementById('clk').getContext('2d');\n  c.clearRect(0,0,400,46);c.strokeStyle='#38bdf8';c.lineWidth=3;c.beginPath();\n  c.moveTo(0,38);c.lineTo(150,38);c.lineTo(150,8);c.lineTo(250,8);c.lineTo(250,38);c.lineTo(400,38);c.stroke();\n  c.fillStyle=clkHigh?'#facc15':'#94a3b8';c.font='14px Arial';\n  c.fillText(clkHigh?'CLK \u2191 rising edge':'CLK',165,28);\n  if(clkHigh){c.beginPath();c.arc(150,23,6,0,7);c.fill()}\n}\nfunction auto(){\n  const b=document.getElementById('autoBtn');\n  if(timer){clearInterval(timer);timer=null;b.textContent='Auto Run';b.classList.remove('on')}\n  else{timer=setInterval(clock,1300);b.textContent='Stop';b.classList.add('on')}\n}\nfunction info(t){document.getElementById('info').textContent=t}\nbuildModes();buildCells();mkPar();drawClk();sync();\n<\/script>\n<\/body>\n<\/html>"}];
const nav=document.getElementById('nav'),wrap=document.getElementById('wrap');
PAGES.forEach(p=>{
 const b=document.createElement('button');b.textContent=p.id+' '+p.title;b.dataset.id=p.id;
 b.onclick=()=>show(p.id);nav.appendChild(b);
 const f=document.createElement('iframe');f.id='f'+p.id;f.title=p.title;wrap.appendChild(f);
});
function show(id){
 PAGES.forEach(p=>{
  const f=document.getElementById('f'+p.id),on=p.id===id;
  f.classList.toggle('active',on);
  if(on&&!f.dataset.loaded){f.srcdoc=p.html;f.dataset.loaded=1;}
 });
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 try{history.replaceState(null,'','#'+id);}catch(e){}
}
const h=location.hash.slice(1);
show(PAGES.some(p=>p.id===h)?h:PAGES[0].id);
</script>
